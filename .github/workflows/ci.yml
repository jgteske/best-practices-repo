name: CI

on:
  # Check every pull request, so a broken example is caught before it is merged.
  pull_request:
    paths: &watched
      - "docs/**"
      - "examples/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "scripts/**"
      - ".github/workflows/**"
  # Check again and deploy whenever the docs, examples, or configs change on main.
  push:
    branches: [main]
    paths: *watched
  # Allow running it by hand from the Actions tab.
  workflow_dispatch:

# Every job starts read-only; the deploy job below adds only what Pages needs.
permissions:
  contents: read

# One run per branch or PR: a new push to a PR cancels its outdated run.
# Runs on main are never cancelled, so every merge gets checked and deployed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # VitePress "last updated" timestamps need git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 22 is the baseline the JavaScript examples document and rely on
          # (Object.groupBy, import.meta.dirname, glob args for `node --test`,
          # node:sqlite unflagged since 22.13).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check examples
        run: npm run typecheck

      # Runs the React examples' component tests (Vitest + Testing Library in jsdom).
      - name: Test React examples
        run: npm run check:react

      - name: Check shell examples
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          npm run check:bash

      # Parses every JavaScript example, then actually executes them (including
      # the node:test suite). No extra tooling needed - Node is already set up.
      - name: Check JavaScript examples
        run: npm run check:js

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # 3.13 is the baseline the Python examples document and rely on
          # (TypeIs, ReadOnly, type-parameter defaults, itertools.batched strict=).
          python-version: "3.13"

      # The mandatory part of check:python needs only Python. These make it
      # also type-check, lint, run pytest and the pydantic examples, execute the
      # notebook, and build and install the Poetry projects - the same way
      # shellcheck is added above. actionlint (pinned) is for check:actions.
      - name: Install Python tooling
        run: pip install poetry mypy ruff pytest nbconvert ipykernel pydantic actionlint-py==1.7.12.25

      - name: Check Python examples
        run: npm run check:python

      # actionlint over this workflow and the examples (shellcheck is installed above).
      - name: Check workflow files
        run: npm run check:actions

      - name: Build site
        run: npm run docs:build

      # Uploads ONLY the compiled static folder generated by VitePress.
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN permissions the Pages deployment needs - for this job only.
    permissions:
      pages: write
      id-token: write
    # Never cancel a deployment midway through publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
