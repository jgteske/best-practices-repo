# Build matrices, dependency caches, and passing files between jobs.
name: Matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # region matrix
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false               # let the other combinations finish when one fails
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        include:
          - os: ubuntu-latest        # one extra combination, with an extra variable
            node: 24
            coverage: true
        exclude:
          - os: windows-latest       # 2 x 2 = 4 jobs, minus this one = 3 (+0: include merged into one)
            node: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm                 # caches ~/.npm, keyed on package-lock.json
      - run: npm ci
      - run: npm test ${{ matrix.coverage && '-- --coverage' || '' }}
  # endregion matrix

  # region cache
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # For tools without a built-in cache option: key on what invalidates the cache.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-
      - run: pipx run pre-commit run --all-files
  # endregion cache

  # region artifacts
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: mkdir -p dist && date -u > dist/built-at.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke-test:
    needs: build                     # jobs run on separate machines: hand files over explicitly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - run: test -s dist/built-at.txt
  # endregion artifacts
