# mypy settings for the standalone examples. Each Poetry project under
# projects/ carries its own [tool.mypy] table in pyproject.toml instead.
[mypy]
python_version = 3.13
strict = True
warn_unreachable = True
# Several directories hold modules that are run as scripts, not imported as a
# package; treat every directory mypy is pointed at as its own import root.
explicit_package_bases = True
exclude = (?x)(^projects/ | /\.venv/ | /dist/)
# Import roots: the `shop` demo package, the pytest examples' module under test,
# and the two distributions the namespace-package demo imports from their src/ dirs.
mypy_path = $MYPY_CONFIG_FILE_DIR/modules:$MYPY_CONFIG_FILE_DIR/testing:$MYPY_CONFIG_FILE_DIR/projects/acme-core/src:$MYPY_CONFIG_FILE_DIR/projects/acme-report/src
