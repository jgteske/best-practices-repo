---
# region sshd
# sshd keeps the first value it reads, and drop-ins load in name order, so 10-
# wins over the 50-cloud-init.conf that Ubuntu images ship.
- name: Harden the SSH daemon
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      # Coolify connects to its own host as root with a key. "no" would break it.
      PermitRootLogin prohibit-password
      X11Forwarding no
      MaxAuthTries 3
    owner: root
    group: root
    mode: "0600"
    # A config that doesn't parse never reaches the server.
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
# endregion sshd
