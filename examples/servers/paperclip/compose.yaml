services:
  # region paperclip
  paperclip:
    image: ghcr.io/paperclipai/paperclip:${PAPERCLIP_TAG:-2026.1023.0}
    restart: unless-stopped
    # Loopback only: Caddy or Tailscale on the host is the way in. Docker's
    # published ports otherwise bypass UFW.
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      HOST: 0.0.0.0
      PAPERCLIP_HOME: /paperclip
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: ${PAPERCLIP_EXPOSURE:-private}
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:?set PAPERCLIP_PUBLIC_URL}
      PAPERCLIP_ALLOWED_HOSTNAMES: ${PAPERCLIP_ALLOWED_HOSTNAMES:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET:?set PAPERCLIP_AGENT_JWT_SECRET}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?set PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
      PAPERCLIP_SECRETS_MASTER_KEY: ${PAPERCLIP_SECRETS_MASTER_KEY:?set PAPERCLIP_SECRETS_MASTER_KEY}
      PAPERCLIP_SECRETS_STRICT_MODE: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - backend
    volumes:
      # Agent files, workspaces and uploads. Not covered by a database backup.
      - paperclip-data:/paperclip
    # Agents start many short-lived processes. If they leak, this container hits
    # the ceiling rather than the whole host.
    pids_limit: 2048
    # Time for running agents to settle before Docker kills them.
    stop_grace_period: 90s
    mem_limit: 4g
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  # endregion paperclip

  # region db
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_DB: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend
    mem_limit: 1g
    logging: *logging
  # endregion db

volumes:
  paperclip-data:
  db-data:

networks:
  backend:
    internal: true
